plugins {
  id 'com.android.application'
  id 'org.jetbrains.kotlin.android'
}

def wwwDir = "$buildDir/generated/www"

android {
  namespace 'io.github.miqatapp.questai'
  compileSdk 34
  defaultConfig {
    applicationId 'io.github.miqatapp.questai'
    minSdk 29
    targetSdk 32
    versionCode 8
    versionName '5.1'
  }
  buildFeatures { buildConfig true }
  signingConfigs {
    release {
      storeFile rootProject.file('questai.keystore')
      storePassword 'questai'
      keyAlias 'questai'
      keyPassword 'questai'
    }
  }
  buildTypes {
    release { signingConfig signingConfigs.release; minifyEnabled false }
  }
  sourceSets { main { assets.srcDirs += [wwwDir] } }
  lint { checkReleaseBuilds false; abortOnError false }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
  kotlinOptions { jvmTarget = '17' }
  packagingOptions { jniLibs { useLegacyPackaging = true } }
}

// Bundle the web UI (../vr) into the APK so the app works without loading a website.
tasks.register('copyWebApp', Copy) {
  from(rootProject.file('../vr')) { exclude 'sw.js', 'manifest.webmanifest', 'xr.js' }
  into("$wwwDir/www")
}
tasks.named('preBuild') { dependsOn 'copyWebApp' }

dependencies {
  implementation 'androidx.webkit:webkit:1.11.0'
  // Meta Spatial SDK: passthrough, panels and entities on Quest
  implementation 'com.meta.spatial:meta-spatial-sdk:0.15.0'
  implementation 'com.meta.spatial:meta-spatial-sdk-toolkit:0.15.0'
  implementation 'com.meta.spatial:meta-spatial-sdk-vr:0.15.0'
}
