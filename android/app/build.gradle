plugins { id 'com.android.application' }

def appUrl = 'https://miqatapp.github.io/vr/'

android {
  namespace 'io.github.miqatapp.questai'
  compileSdk 34
  defaultConfig {
    applicationId 'io.github.miqatapp.questai'
    minSdk 29
    targetSdk 32
    versionCode 1
    versionName '1.0'
    manifestPlaceholders = [appUrl: appUrl, hostName: 'miqatapp.github.io']
  }
  signingConfigs {
    release {
      storeFile rootProject.file('questai.keystore')
      storePassword 'questai'
      keyAlias 'questai'
      keyPassword 'questai'
    }
  }
  buildTypes {
    release { signingConfig signingConfigs.release; minifyEnabled false }
  }
  lint { checkReleaseBuilds false; abortOnError false }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
  implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
