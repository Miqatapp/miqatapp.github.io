name: Build Quest AI APK

on:
  push:
    paths: ['android/**', 'vr/**', '.github/workflows/quest-ai-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build signed APK
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk QuestAI.apk
      - uses: actions/upload-artifact@v4
        with: { name: QuestAI-apk, path: QuestAI.apk }
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: quest-ai
          name: Quest AI (Meta Quest)
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: QuestAI.apk
          body: |
            Quest AI — مساعد ذكاء اصطناعي لنظارة Meta Quest (تطبيق أصلي).
            حمّل QuestAI.apk وثبّته على النظارة (وضع المطوّر + SideQuest أو Meta Quest Developer Hub).

  # Installs the APK on an Android emulator, launches it and captures screenshots + the app's console log.
  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: QuestAI-apk }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 32
          arch: x86_64
          target: google_apis
          profile: pixel_tablet
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          script: bash .github/scripts/emulator-test.sh
      - name: Publish screenshots to branch quest-ai-ci
        if: always()
        run: |
          cd shots || exit 0
          git init -q && git checkout -q -b quest-ai-ci
          git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add -A && git commit -qm "CI screenshots ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" quest-ai-ci
