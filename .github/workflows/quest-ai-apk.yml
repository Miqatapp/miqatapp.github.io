name: Build Quest AI APK

on:
  push:
    paths: ['android/**', '.github/workflows/quest-ai-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build signed APK
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk QuestAI.apk
      - uses: actions/upload-artifact@v4
        with: { name: QuestAI-apk, path: QuestAI.apk }
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: quest-ai
          name: Quest AI (Meta Quest)
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: QuestAI.apk
          body: |
            Quest AI — مساعد ذكاء اصطناعي لنظارة Meta Quest.
            حمّل QuestAI.apk وثبّته على النظارة (يحتاج وضع المطوّر + SideQuest أو Meta Quest Developer Hub).
